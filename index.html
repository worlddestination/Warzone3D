<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Zone — Sci-Fi FPS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace}
#gc{display:block;width:100vw;height:100vh;cursor:crosshair}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;color:#fff}
#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px}
#cross::before{content:'';position:absolute;left:11px;top:0;width:2px;height:24px;background:rgba(0,220,255,0.9)}
#cross::after{content:'';position:absolute;top:11px;left:0;width:24px;height:2px;background:rgba(0,220,255,0.9)}
#cross-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:4px;height:4px;background:#00dcff;border-radius:50%}
#ammo-panel{position:absolute;bottom:28px;right:28px;text-align:right}
#ammo-num{font-size:42px;font-weight:bold;color:#00dcff;text-shadow:0 0 14px #00dcff88;letter-spacing:2px}
#ammo-res{font-size:15px;color:#aaa;margin-top:2px}
#weapon-icon{font-size:13px;color:#ff6b35;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
#hp-panel{position:absolute;bottom:28px;left:28px}
#hp-label{font-size:11px;color:#888;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
#hp-bar{width:180px;height:6px;background:#1a1a2e;border:1px solid #00dcff44;border-radius:2px;overflow:hidden}
#hp-fill{height:100%;width:100%;background:#00dcff;border-radius:2px;transition:width .3s}
#hp-val{font-size:22px;font-weight:bold;color:#00dcff;margin-top:6px}
#kills-panel{position:absolute;top:20px;right:28px;text-align:right}
#kills-num{font-size:26px;font-weight:bold;color:#ff6b35;text-shadow:0 0 10px #ff6b3566}
#kills-label{font-size:10px;color:#666;letter-spacing:2px}
#radar{position:absolute;top:20px;left:28px}
#radar canvas{border-radius:50%;border:1px solid #00dcff33;display:block}
#hit-overlay{position:absolute;inset:0;pointer-events:none;background:rgba(255,30,30,0);transition:background .08s}
#msg-screen{position:absolute;top:40%;left:50%;transform:translateX(-50%);text-align:center;display:none}
#msg-screen h2{font-size:36px;letter-spacing:6px;text-shadow:0 0 20px currentColor}
#msg-screen p{font-size:14px;color:#888;margin-top:10px;letter-spacing:2px}
#reload-txt{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);font-size:15px;color:#ff6b35;letter-spacing:4px;display:none}
#start-overlay{position:fixed;inset:0;background:#000d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:all;z-index:100}
#start-overlay h1{font-size:52px;letter-spacing:10px;color:#00dcff;text-shadow:0 0 40px #00dcff;margin-bottom:6px}
#start-overlay .sub{font-size:13px;color:#ff6b35;letter-spacing:5px;margin-bottom:36px}
.ctrl-row{display:flex;gap:20px;margin-bottom:10px}
.ctrl{background:#0a1628;border:1px solid #00dcff22;padding:10px 18px;border-radius:4px;font-size:12px;color:#888;letter-spacing:1px}
.ctrl span{color:#00dcff}
#play-btn{margin-top:28px;padding:16px 56px;background:transparent;border:1px solid #00dcff;color:#00dcff;font-family:'Courier New',monospace;font-size:18px;letter-spacing:5px;cursor:pointer;text-transform:uppercase;transition:all .25s}
#play-btn:hover{background:#00dcff;color:#000;box-shadow:0 0 30px #00dcff88}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="ui">
  <div id="cross"><div id="cross-dot"></div></div>
  <div id="ammo-panel">
    <div id="weapon-icon">■ AK-47</div>
    <div id="ammo-num">30</div>
    <div id="ammo-res">/ 90</div>
  </div>
  <div id="hp-panel">
    <div id="hp-label">SHIELD</div>
    <div id="hp-bar"><div id="hp-fill"></div></div>
    <div id="hp-val">100</div>
  </div>
  <div id="kills-panel">
    <div id="kills-num">0</div>
    <div id="kills-label">KILLS</div>
  </div>
  <div id="radar"><canvas id="radarC" width="110" height="110"></canvas></div>
  <div id="hit-overlay"></div>
  <div id="reload-txt">RELOADING...</div>
  <div id="msg-screen"></div>
</div>
<div id="start-overlay">
  <h1>BATTLE ZONE</h1>
  <div class="sub">SCI-FI COMBAT ARENA</div>
  <div class="ctrl-row">
    <div class="ctrl"><span>WASD</span> Move</div>
    <div class="ctrl"><span>Mouse</span> Aim</div>
    <div class="ctrl"><span>Click</span> Fire</div>
  </div>
  <div class="ctrl-row">
    <div class="ctrl"><span>R</span> Reload</div>
    <div class="ctrl"><span>Shift</span> Sprint</div>
    <div class="ctrl"><span>Space</span> Jump</div>
  </div>
  <button id="play-btn" onclick="startGame()">[ DEPLOY ]</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

/* ── State ── */
let renderer, scene, camera, clock;
let enemies = [], bullets = [];
let hp = 100, ammo = 30, reserve = 90, kills = 0;
let reloading = false;
let keys = {};
let yaw = 0, pitch = 0;
let velY = 0, onGnd = true;
let shootCD = 0, muzzleT = 0;
let muzzleLight, muzzleMesh, gunGroup;
let gameOn = false;
let bobT = 0;

const canvas  = document.getElementById('gc');
const radarCV = document.getElementById('radarC');
const radarCtx = radarCV.getContext('2d');

/* ── Entry ── */
window.startGame = function () {
  document.getElementById('start-overlay').style.display = 'none';
  initThree();
  gameOn = true;
  canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
  canvas.requestPointerLock();
};

/* ── Three.js init ── */
function initThree() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050b14);
  scene.fog = new THREE.FogExp2(0x050b14, 0.020);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 200);
  camera.position.set(0, 1.75, 0);
  camera.rotation.order = 'YXZ';

  clock = new THREE.Clock();

  buildLighting();
  buildArena();
  buildGun();
  spawnEnemies();

  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyR') doReload(); });
  document.addEventListener('keyup',   e => { keys[e.code] = false; });
  canvas.addEventListener('click', () => { canvas.requestPointerLock(); if (gameOn) fire(); });
  window.addEventListener('resize', onResize);

  animate();
}

/* ── Lighting ── */
function buildLighting() {
  scene.add(new THREE.AmbientLight(0x0a1428, 2.5));

  const sun = new THREE.DirectionalLight(0x4488ff, 1.8);
  sun.position.set(12, 25, 12);
  sun.castShadow = true;
  sun.shadow.mapSize.setScalar(2048);
  sun.shadow.camera.near   = 0.1;
  sun.shadow.camera.far    = 100;
  sun.shadow.camera.left   = -45;
  sun.shadow.camera.right  =  45;
  sun.shadow.camera.top    =  45;
  sun.shadow.camera.bottom = -45;
  scene.add(sun);

  scene.add(Object.assign(new THREE.DirectionalLight(0xff6b35, 0.5), { position: new THREE.Vector3(-10, 6, -10) }));

  muzzleLight = new THREE.PointLight(0xffaa22, 0, 4);
  muzzleLight.position.set(0.2, -0.15, 0.9);
  camera.add(muzzleLight);
  scene.add(camera);

  const pts = [
    { p: [ 14, 5,  14], c: 0x0044ff },
    { p: [-14, 5,  14], c: 0xff3300 },
    { p: [ 14, 5, -14], c: 0x0044ff },
    { p: [-14, 5, -14], c: 0xff3300 },
    { p: [  0, 7,   0], c: 0x00ffcc },
  ];
  pts.forEach(({ p, c }) => {
    const l = new THREE.PointLight(c, 1.4, 22);
    l.position.set(...p);
    scene.add(l);
    const s = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 8, 8),
      new THREE.MeshBasicMaterial({ color: c })
    );
    s.position.set(...p);
    scene.add(s);
  });
}

/* ── Arena ── */
function buildArena() {
  /* Floor */
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x0d1520, roughness: 0.85, metalness: 0.15 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90, 45, 45), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  /* Glowing grid lines */
  const glowMat = new THREE.MeshStandardMaterial({ color: 0x00dcff, emissive: 0x00dcff, emissiveIntensity: 0.7, roughness: 0.2, metalness: 0.9 });
  for (let i = -4; i <= 4; i++) {
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.012, 90), glowMat);
    h.position.set(i * 6, 0.007, 0);
    scene.add(h);
    const v = new THREE.Mesh(new THREE.BoxGeometry(90, 0.012, 0.07), glowMat);
    v.position.set(0, 0.007, i * 6);
    scene.add(v);
  }

  /* Walls */
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.7, metalness: 0.5 });
  [
    { size: [90, 10, 1], pos: [0, 5,  45] },
    { size: [90, 10, 1], pos: [0, 5, -45] },
    { size: [1, 10, 90], pos: [ 45, 5, 0] },
    { size: [1, 10, 90], pos: [-45, 5, 0] },
  ].forEach(({ size, pos }) => {
    const w = new THREE.Mesh(new THREE.BoxGeometry(...size), wallMat);
    w.position.set(...pos);
    w.castShadow = true;
    w.receiveShadow = true;
    scene.add(w);
    /* Glowing base stripe */
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(size[0], 0.18, size[2]), glowMat);
    stripe.position.set(pos[0], pos[1] - 4.9, pos[2]);
    scene.add(stripe);
  });

  /* Cover crates */
  const crateMat = new THREE.MeshStandardMaterial({ color: 0x1a2840, roughness: 0.45, metalness: 0.75 });
  [
    [9,9],[−9,9],[9,−9],[−9,−9],
    [0,16],[16,0],[−16,0],[0,−16],
    [5,0],[−5,0],[0,5],[0,−5],
  ].forEach(([x, z]) => {
    const h = 2.0 + Math.random() * 1.5;
    const w = 1.6 + Math.random() * 0.8;
    const c = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), crateMat);
    c.position.set(x, h / 2, z);
    c.castShadow = true;
    c.receiveShadow = true;
    scene.add(c);
    /* Top glow edge */
    const top = new THREE.Mesh(new THREE.BoxGeometry(w + 0.06, 0.09, w + 0.06), glowMat);
    top.position.set(x, h + 0.04, z);
    scene.add(top);
  });

  /* Trees */
  const trunkMat  = new THREE.MeshStandardMaterial({ color: 0x1a3a2a, roughness: 0.95, metalness: 0.05 });
  const leavesMat = new THREE.MeshStandardMaterial({ color: 0x0d2a18, roughness: 1,    metalness: 0 });
  for (let i = 0; i < 24; i++) {
    const tx = (Math.random() - 0.5) * 70, tz = (Math.random() - 0.5) * 70;
    const th = 5 + Math.random() * 4;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.32, th, 8), trunkMat);
    trunk.position.set(tx, th / 2, tz);
    trunk.castShadow = true;
    scene.add(trunk);
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.6 + Math.random(), 7, 7), leavesMat);
    leaves.position.set(tx, th + 0.6, tz);
    leaves.castShadow = true;
    scene.add(leaves);
  }

  /* Pillars around arena */
  const pillarMat = new THREE.MeshStandardMaterial({ color: 0x223344, roughness: 0.3, metalness: 0.9 });
  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * Math.PI * 2;
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 14, 7), pillarMat);
    p.position.set(Math.cos(ang) * 28, 7, Math.sin(ang) * 28);
    scene.add(p);
  }
}

/* ── Player gun ── */
function buildGun() {
  gunGroup = new THREE.Group();

  const bodyMat   = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.18, metalness: 0.96 });
  const accentMat = new THREE.MeshStandardMaterial({ color: 0xff6b35, roughness: 0.28, metalness: 0.85, emissive: 0xff3300, emissiveIntensity: 0.35 });

  const parts = [
    { g: new THREE.BoxGeometry(0.1, 0.08, 0.52),        pos: [0, 0, 0],      rot: null,           mat: bodyMat   },
    { g: new THREE.CylinderGeometry(0.02, 0.02, 0.36, 8), pos: [0, 0.01, 0.44], rot: [Math.PI/2,0,0], mat: bodyMat   },
    { g: new THREE.BoxGeometry(0.08, 0.11, 0.22),        pos: [0, -0.02,-0.3], rot: null,           mat: bodyMat   },
    { g: new THREE.BoxGeometry(0.06, 0.15, 0.08),        pos: [0, -0.1, -0.05],rot: null,           mat: bodyMat   },
    { g: new THREE.BoxGeometry(0.06, 0.17, 0.09),        pos: [0, -0.12, 0.02],rot: null,           mat: new THREE.MeshStandardMaterial({ color:0x222, roughness:0.4, metalness:0.6 }) },
    { g: new THREE.BoxGeometry(0.03, 0.03, 0.09),        pos: [0, 0.065, 0.1], rot: null,           mat: accentMat },
    { g: new THREE.BoxGeometry(0.11, 0.012, 0.42),       pos: [0, 0.047, 0],   rot: null,           mat: accentMat },
  ];
  parts.forEach(({ g, pos, rot, mat }) => {
    const m = new THREE.Mesh(g, mat);
    m.position.set(...pos);
    if (rot) m.rotation.set(...rot);
    gunGroup.add(m);
  });

  muzzleMesh = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffaa22 }));
  muzzleMesh.position.set(0, 0.01, 0.64);
  muzzleMesh.visible = false;
  gunGroup.add(muzzleMesh);

  gunGroup.position.set(0.22, -0.22, 0.46);
  camera.add(gunGroup);
}

/* ── Enemy factory ── */
function makeEnemy(x, z, id) {
  const g = new THREE.Group();

  const bodyMat   = new THREE.MeshStandardMaterial({ color: 0xcc2200, roughness: 0.5, metalness: 0.65 });
  const armorMat  = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.28, metalness: 0.92 });
  const visorMat  = new THREE.MeshStandardMaterial({ color: 0xff4400, roughness: 0.1,  metalness: 0.85, emissive: 0xff2200, emissiveIntensity: 0.55 });
  const glowChest = new THREE.MeshStandardMaterial({ color: 0xff4400, emissive: 0xff2200, emissiveIntensity: 1.2 });

  const add = (geo, mat, px, py, pz, rx, ry, rz) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(px, py, pz);
    if (rx !== undefined) m.rotation.set(rx, ry, rz);
    m.castShadow = true;
    g.add(m);
    return m;
  };

  const torso   = add(new THREE.BoxGeometry(0.65, 0.8, 0.35),           bodyMat,  0,    1.0,  0);
  const chest   = add(new THREE.BoxGeometry(0.70, 0.5, 0.20),           armorMat, 0,    1.1,  0.1);
                  add(new THREE.BoxGeometry(0.15, 0.09, 0.06),           glowChest,0,    1.15, 0.21);
  const head    = add(new THREE.SphereGeometry(0.245, 10, 10),           armorMat, 0,    1.72, 0);
  const visor   = add(new THREE.BoxGeometry(0.30, 0.10, 0.08),           visorMat, 0,    1.74, 0.20);
                  add(new THREE.SphereGeometry(0.19, 8, 8),              armorMat, 0.46, 1.22, 0);
                  add(new THREE.SphereGeometry(0.19, 8, 8),              armorMat,-0.46, 1.22, 0);
  const armL    = add(new THREE.CylinderGeometry(0.09,0.07,0.55,8),     bodyMat,  0.50, 0.85, 0, 0, 0, -0.22);
  const armR    = add(new THREE.CylinderGeometry(0.09,0.07,0.55,8),     bodyMat, -0.50, 0.85, 0, 0, 0,  0.22);
  const legL    = add(new THREE.CylinderGeometry(0.10,0.09,0.72,8),     bodyMat,  0.19, 0.36, 0);
  const legR    = add(new THREE.CylinderGeometry(0.10,0.09,0.72,8),     bodyMat, -0.19, 0.36, 0);
                  add(new THREE.BoxGeometry(0.06, 0.06, 0.50),           armorMat, 0.55, 1.00, 0.26);

  g.position.set(x, 0, z);
  scene.add(g);

  return {
    mesh: g, head, torso, visor, armL, armR, legL, legR,
    hp: 120, alive: true, id,
    baseX: x, baseZ: z,
    state: 'patrol',
    patrolAngle: Math.random() * Math.PI * 2,
    patrolR: 3.5 + Math.random() * 4,
    shootT: Math.random() * 3 + 1,
    walkT:  Math.random() * Math.PI * 2,
  };
}

function spawnEnemies() {
  [[15,15],[-15,15],[15,-15],[-15,-15],[0,18],[18,0],[-18,0],[0,-18]]
    .forEach(([x, z], i) => enemies.push(makeEnemy(x, z, i)));
}

/* ── Shooting ── */
function fire() {
  if (!gameOn || reloading) return;
  if (ammo <= 0) { doReload(); return; }
  if (shootCD > 0) return;

  ammo--;
  shootCD = 0.1;
  updateHUD();

  muzzleMesh.visible = true;
  muzzleLight.intensity = 10;
  muzzleT = 0.07;

  gunGroup.position.z = 0.39;
  setTimeout(() => { gunGroup.position.z = 0.46; }, 65);
  pitch -= 0.009 + Math.random() * 0.005;
  setTimeout(() => { pitch += 0.009; }, 90);

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const ray = new THREE.Raycaster(camera.position.clone(), dir.normalize(), 0.1, 120);

  let bestDist = Infinity, bestHit = null, bestEnemy = null, bestMesh = null;
  enemies.forEach(e => {
    if (!e.alive) return;
    [e.head, e.torso, e.visor].forEach(m => {
      const hits = ray.intersectObject(m, false);
      if (hits.length && hits[0].distance < bestDist) {
        bestDist  = hits[0].distance;
        bestHit   = hits[0];
        bestEnemy = e;
        bestMesh  = m;
      }
    });
  });

  if (bestHit && bestEnemy) {
    const isHead = bestMesh === bestEnemy.head || bestMesh === bestEnemy.visor;
    const dmg    = isHead ? 75 : 30;
    bestEnemy.hp -= dmg;
    floatDmg(bestHit.point, dmg, isHead);
    spawnImpact(bestHit.point);
    if (bestEnemy.hp <= 0) killEnemy(bestEnemy);
  }
}

function spawnImpact(pos) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.07, 5, 5), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
  s.position.copy(pos);
  scene.add(s);
  const l = new THREE.PointLight(0xffaa00, 4, 2.5);
  l.position.copy(pos);
  scene.add(l);
  setTimeout(() => { scene.remove(s); scene.remove(l); }, 180);
}

function floatDmg(pos, dmg, isHead) {
  const div = document.createElement('div');
  div.style.cssText = `position:fixed;font-family:'Courier New',monospace;font-weight:bold;pointer-events:none;z-index:500;font-size:${isHead?'24':'16'}px;color:${isHead?'#ffcc00':'#ff4444'};text-shadow:0 0 8px currentColor;`;
  div.textContent = isHead ? ('HEADSHOT ' + dmg) : ('-' + dmg);
  document.getElementById('ui').appendChild(div);
  const v = pos.clone().project(camera);
  div.style.left = ((v.x + 1) / 2 * window.innerWidth)  + 'px';
  div.style.top  = ((-(v.y - 1)) / 2 * window.innerHeight) + 'px';
  let op = 1, dy = 0;
  const t = setInterval(() => {
    dy -= 2; op -= 0.035;
    div.style.transform = `translateY(${dy}px)`;
    div.style.opacity = op;
    if (op <= 0) { clearInterval(t); div.remove(); }
  }, 30);
}

function killEnemy(e) {
  e.alive = false;
  kills++;
  document.getElementById('kills-num').textContent = kills;
  e.mesh.rotation.z = Math.PI / 2;
  e.mesh.position.y = -0.65;
  const deadMat = new THREE.MeshStandardMaterial({ color: 0x220000, roughness: 1 });
  e.head.material  = deadMat;
  e.torso.material = deadMat;
  if (!enemies.some(x => x.alive)) endGame(true);
}

function endGame(won) {
  gameOn = false;
  const ms = document.getElementById('msg-screen');
  ms.style.display = 'block';
  ms.style.color   = won ? '#00dcff' : '#ff4444';
  ms.innerHTML = won
    ? `<h2>MISSION COMPLETE</h2><p>ALL THREATS ELIMINATED &mdash; KILLS: ${kills}</p>`
    : `<h2>YOU ARE DEAD</h2><p>KILLS: ${kills} &mdash; REFRESH TO RETRY</p>`;
}

/* ── Reload ── */
function doReload() {
  if (reloading || reserve <= 0 || ammo === 30) return;
  reloading = true;
  document.getElementById('reload-txt').style.display = 'block';
  gunGroup.rotation.x = 0.5;
  setTimeout(() => {
    const need = 30 - ammo, got = Math.min(need, reserve);
    ammo += got; reserve -= got;
    reloading = false;
    gunGroup.rotation.x = 0;
    document.getElementById('reload-txt').style.display = 'none';
    updateHUD();
  }, 2000);
}

/* ── Take damage ── */
function takeDmg(d) {
  hp = Math.max(0, hp - d);
  updateHUD();
  const o = document.getElementById('hit-overlay');
  o.style.background = 'rgba(255,20,20,0.45)';
  setTimeout(() => { o.style.background = 'rgba(255,20,20,0)'; }, 150);
  if (hp <= 0) endGame(false);
}

/* ── HUD ── */
function updateHUD() {
  document.getElementById('ammo-num').textContent = ammo;
  document.getElementById('ammo-res').textContent = '/ ' + reserve;
  document.getElementById('hp-fill').style.width  = hp + '%';
  document.getElementById('hp-val').textContent   = hp;
}

/* ── Radar ── */
function drawRadar() {
  const W = radarCV.width, H = radarCV.height, cx = W / 2, cy = H / 2;
  radarCtx.clearRect(0, 0, W, H);
  radarCtx.fillStyle = 'rgba(0,5,15,0.78)';
  radarCtx.beginPath(); radarCtx.arc(cx, cy, cx - 1, 0, Math.PI * 2); radarCtx.fill();

  radarCtx.strokeStyle = 'rgba(0,220,255,0.22)';
  radarCtx.lineWidth   = 0.6;
  [18, 36, cx - 1].forEach(r => {
    radarCtx.beginPath(); radarCtx.arc(cx, cy, r, 0, Math.PI * 2); radarCtx.stroke();
  });
  radarCtx.beginPath(); radarCtx.moveTo(cx, 2); radarCtx.lineTo(cx, H - 2); radarCtx.stroke();
  radarCtx.beginPath(); radarCtx.moveTo(2, cy); radarCtx.lineTo(W - 2, cy); radarCtx.stroke();

  const cosY = Math.cos(-yaw), sinY = Math.sin(-yaw), sc = (cx - 2) / 40;
  enemies.forEach(e => {
    if (!e.alive) return;
    const dx = e.mesh.position.x - camera.position.x;
    const dz = e.mesh.position.z - camera.position.z;
    const rx = dx * cosY - dz * sinY;
    const rz = dx * sinY + dz * cosY;
    const ex = cx + rx * sc, ez = cy + rz * sc;
    if (ex < 2 || ex > W - 2 || ez < 2 || ez > H - 2) return;
    radarCtx.fillStyle = '#ff4444';
    radarCtx.beginPath(); radarCtx.arc(ex, ez, 3.5, 0, Math.PI * 2); radarCtx.fill();
  });

  radarCtx.fillStyle = '#00dcff';
  radarCtx.beginPath(); radarCtx.arc(cx, cy, 5, 0, Math.PI * 2); radarCtx.fill();
  radarCtx.strokeStyle = '#00dcff'; radarCtx.lineWidth = 1.8;
  radarCtx.beginPath(); radarCtx.moveTo(cx, cy); radarCtx.lineTo(cx, cy - 18); radarCtx.stroke();
}

/* ── Mouse ── */
function onMouseMove(e) {
  if (!gameOn) return;
  if (document.pointerLockElement !== canvas && document.mozPointerLockElement !== canvas) return;
  const s = 0.0014;
  yaw   -= e.movementX * s;
  pitch  = Math.max(-1.15, Math.min(1.15, pitch - e.movementY * s));
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}

/* ── Main loop ── */
function animate() {
  requestAnimationFrame(animate);
  if (!gameOn) { renderer.render(scene, camera); return; }

  const dt = clock.getDelta();

  /* Cooldowns */
  if (shootCD > 0) shootCD -= dt;
  if (muzzleT  > 0) {
    muzzleT -= dt;
    if (muzzleT <= 0) { muzzleMesh.visible = false; muzzleLight.intensity = 0; }
  }

  /* Player movement */
  const sprint = keys['ShiftLeft'] || keys['ShiftRight'];
  const spd    = sprint ? 0.145 : 0.085;
  const fwd    = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const rgt    = new THREE.Vector3( Math.cos(yaw), 0, -Math.sin(yaw));
  let moving   = false;

  if (keys['KeyW']) { camera.position.addScaledVector(fwd,  spd); moving = true; }
  if (keys['KeyS']) { camera.position.addScaledVector(fwd, -spd); moving = true; }
  if (keys['KeyA']) { camera.position.addScaledVector(rgt, -spd); moving = true; }
  if (keys['KeyD']) { camera.position.addScaledVector(rgt,  spd); moving = true; }

  camera.position.x = Math.max(-42, Math.min(42, camera.position.x));
  camera.position.z = Math.max(-42, Math.min(42, camera.position.z));

  /* Jump */
  if (keys['Space'] && onGnd) { velY = 0.22; onGnd = false; }
  if (!onGnd) {
    velY -= 0.016;
    camera.position.y += velY;
    if (camera.position.y <= 1.75) { camera.position.y = 1.75; onGnd = true; velY = 0; }
  }

  /* Gun bob */
  if (moving) {
    bobT += dt * (sprint ? 11 : 6.5);
    gunGroup.position.y = -0.22 + Math.abs(Math.sin(bobT * 2)) * 0.01;
    gunGroup.position.x =  0.22 + Math.sin(bobT) * 0.005;
    camera.position.y   =  1.75 + Math.abs(Math.sin(bobT)) * 0.012;
  }

  /* Enemy AI */
  enemies.forEach(e => {
    if (!e.alive) return;
    const dx = camera.position.x - e.mesh.position.x;
    const dz = camera.position.z - e.mesh.position.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    const ang  = Math.atan2(dx, dz);
    e.mesh.rotation.y = ang;

    e.state = dist < 30 ? 'chase' : 'patrol';

    /* Walk animation */
    e.walkT += dt * (e.state === 'chase' ? 5.5 : 2);
    const wAmt = e.state === 'chase' ? 0.32 : 0.16;
    e.legL.rotation.x =  Math.sin(e.walkT)          * wAmt;
    e.legR.rotation.x =  Math.sin(e.walkT + Math.PI) * wAmt;
    e.armL.rotation.x =  Math.sin(e.walkT + Math.PI) * wAmt * 0.55;
    e.armR.rotation.x =  Math.sin(e.walkT)           * wAmt * 0.55;

    /* Move */
    if (e.state === 'chase' && dist > 4) {
      e.mesh.position.x += Math.sin(ang) * 0.052;
      e.mesh.position.z += Math.cos(ang) * 0.052;
    } else if (e.state === 'patrol') {
      e.patrolAngle += dt * 0.42;
      e.mesh.position.x = e.baseX + Math.cos(e.patrolAngle) * e.patrolR;
      e.mesh.position.z = e.baseZ + Math.sin(e.patrolAngle) * e.patrolR;
    }

    /* Shoot at player */
    e.shootT -= dt;
    if (e.shootT <= 0 && dist < 24 && e.state === 'chase') {
      e.shootT = 1.8 + Math.random() * 2;
      if (Math.random() < (dist < 10 ? 0.52 : 0.26)) takeDmg(10);
    }
  });

  drawRadar();
  renderer.render(scene, camera);
}

/* ── Resize ── */
function onResize() {
  if (!renderer) return;
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
</script>
